services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: receptra, POSTGRES_PASSWORD: receptra, POSTGRES_DB: receptra }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://receptra:receptra@db/receptra
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
